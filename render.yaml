services:
  - type: web
    name: wavy-health-api
    env: go
    plan: free
    buildCommand: go build -tags netgo -ldflags '-s -w' -o app
    startCommand: ./app
    envVars:
      - key: DB_URL
        value: $DB_URL
      - key: JWT_SECRET
        value: $JWT_SECRET
      - key: INITIAL_STOCK_PRICE
        value: $INITIAL_STOCK_PRICE
    goVersion: 1.25
